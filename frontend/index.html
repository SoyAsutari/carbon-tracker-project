<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbon Footprint Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Carbon Footprint Tracker</h1>
    <p class="subtitle">Log your daily activities and track your emissions</p>
  </header>

  <main class="container">
    <!-- ===== FORM ===== -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Log a New Activity</h2>

      <!-- role=alert so screen readers announce feedback -->
      <div id="feedback" class="feedback" role="alert" aria-live="polite"></div>

      <form id="log-form" novalidate>
        <div class="field">
          <label for="activity">Activity <span class="req">*</span></label>
          <select id="activity" name="activity_id" required>
            <option value="">-- Select Activity --</option>
            <option value="1">1 - Car Travel (Petrol)</option>
            <option value="2">2 - Electricity Usage</option>
            <option value="3">3 - Beef Meal</option>
            <option value="4">4 - Public Transport</option>
          </select>
          <span class="error" data-for="activity_id"></span>
        </div>

        <div class="field">
          <label for="value">Amount (e.g., km, kWh, or servings) <span class="req">*</span></label>
          <input type="number" id="value" name="value" step="0.1" min="0.1" placeholder="e.g. 15.5" required />
          <span class="error" data-for="value"></span>
        </div>

        <div class="field">
          <label for="log_date">Date <span class="req">*</span></label>
          <input type="date" id="log_date" name="log_date" required />
          <span class="error" data-for="log_date"></span>
        </div>

        <div class="field">
          <label for="notes">Notes (Optional)</label>
          <input type="text" id="notes" name="notes" placeholder="e.g. Drove to university" maxlength="255" />
        </div>

        <!-- Hidden user_id for this simulation (Simulating User 1 logged in) -->
        <input type="hidden" id="user_id" name="user_id" value="1" />

        <button type="submit" id="submit-btn" class="btn btn-primary">
          Log Activity
        </button>
      </form>
    </section>

    <!-- ===== DATA DISPLAY ===== -->
    <section class="card" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">My Emission Logs</h2>
        <button id="refresh-btn" class="btn btn-ghost" title="Reload logs">
          ↻ Refresh
        </button>
      </div>

      <div id="loading" class="loading hidden">Loading logs…</div>
      <div id="empty-state" class="empty hidden">No logs yet. Add one above!</div>

      <table id="task-table" class="task-table hidden">
        <thead>
          <tr>
            <th>Date</th>
            <th>Activity ID</th>
            <th>Amount</th>
            <th>Est. Emissions (kg CO2)</th>
            <th>Notes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="task-body"><!-- rows injected by JS --></tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    <small>CIT22103 Cloud Computing — Assignment 2 (Carbon Footprint Tracker)</small>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
